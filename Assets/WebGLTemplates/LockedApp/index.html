<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>黄道征途</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      left: 0;
      top: 0;
      touch-action: none;
      background: #050814;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    #unity-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      /* 允许 Unity 接收画布上的滑动；浏览器页面锁滚动由 body 负责 */
      touch-action: none;
      outline: none;
    }
    #unity-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cfefff;
      font-family: system-ui, sans-serif;
      font-size: 18px;
      background: #050814;
      z-index: 2;
    }
    #unity-loading.hidden { display: none; }
  </style>
</head>
<body>
  <div id="unity-container">
    <div id="unity-loading">黄道征途 加载中…</div>
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
  </div>

  <script>
    // 锁定页面：禁止浏览器滚动 / 双指缩放 / 回弹，像原生 App
    (function () {
      function block(e) {
        // 画布上的触控要交给 Unity，否则战机拖不动
        var t = e.target;
        if (t && (t.id === 'unity-canvas' || (t.closest && t.closest('#unity-canvas')))) {
          return;
        }
        e.preventDefault();
      }
      document.addEventListener('touchmove', block, { passive: false });
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('wheel', function (e) {
        var t = e.target;
        if (t && (t.id === 'unity-canvas' || (t.closest && t.closest('#unity-canvas')))) return;
        e.preventDefault();
      }, { passive: false });
      document.body.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      function hideBars() {
        window.scrollTo(0, 0);
        document.body.style.height = window.innerHeight + 'px';
      }
      window.addEventListener('resize', hideBars);
      window.addEventListener('orientationchange', function () {
        setTimeout(hideBars, 250);
      });
      hideBars();
      var unlocked = false;
      function tryFullscreen() {
        if (unlocked) return;
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (!req) return;
        try {
          var p = req.call(el);
          if (p && p.then) p.then(function () { unlocked = true; }).catch(function () {});
          else unlocked = true;
        } catch (err) {}
      }
      document.addEventListener('pointerdown', tryFullscreen, { once: false });
    })();
  </script>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: window.devicePixelRatio || 1
    };
    createUnityInstance(canvas, config, function (progress) {
      if (loading) {
        var pct = Math.floor(progress * 100);
        loading.textContent = "黄道征途 加载中… " + pct + "%";
      }
    }).then(function (unityInstance) {
      if (loading) loading.classList.add("hidden");
    }).catch(function (message) {
      if (loading) loading.textContent = "加载失败：" + message;
    });
  </script>
</body>
</html>
